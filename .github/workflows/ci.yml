name: Systic Hard Truth Pipeline

on:
  push:
    tags:
      - "release-v*"

permissions:
  contents: write

jobs:
  sovereign-build:
    name: Build & Extract Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Alpine Docker Image
        run: docker build -t systic-alpine -f .github/workflows/Dockerfile .

      - name: Run Pipeline (TESTING phase)
        # 1001:1001 is the default ID for the GitHub Runner user
        run: |
          docker run --rm --user root -v ${{ github.workspace }}:/workspace systic-alpine \
            /bin/bash -c "chmod +x ./build.sh && ./build.sh Testing && chown -R 1001:1001 /workspace"

      - name: Upload Artifacts (Internal CI)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systic-transparency-reports
          path: |
            test_results.xml
            bench_results.json

      - name: Attach Hard Truth Reports to Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          files: |
            test_results.xml
            bench_results.json
          body: "Verification and performance transparency reports for this release."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
