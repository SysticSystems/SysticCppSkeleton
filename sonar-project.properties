# ============================================================================
# Systic Sovereign Architecture — SonarQube Configuration
# ============================================================================

# Code Base Settings
sonar.sourceEncoding=UTF-8
sonar.sources=src,include
sonar.tests=tests

# Target Dev Build Toolchain Reference
sonar.cfamily.compile-commands=.build-dev/compile_commands.json

# ============================================================================
# Custom Documentation Architecture Rules
# ============================================================================

# Rule 1: Verify every method/class explicitly defines the 5 mandatory architectural tags
sonar.custom.co1.ruleKey=common-cpp:InsufficientCommentDensity
sonar.custom.co1.severity=CRITICAL
sonar.custom.co1.config.regex=(?s)/\*.*@Kind.*@Complexity.*@Tradeoffs.*@Strategy.*@Implementation.*\*/

# Rule 2: Blocker Gate — Catch @Kind Hot methods incorrectly placed in a translation unit (.cpp)
sonar.custom.hot_placement.name=Hot Method Placement Breach
sonar.custom.hot_placement.description=Methods marked @Kind Hot must be defined in inline headers, never inside a .cpp translation unit.
sonar.custom.hot_placement.filePattern=**/*.cpp
sonar.custom.hot_placement.regex=(?s)/\*.*@Kind\s+Hot.*\*/\s*[^;{]*\{
sonar.custom.hot_placement.severity=BLOCKER